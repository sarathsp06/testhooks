# Standalone deployment: pulls the published image, no clone or build needed.
#
#   curl -fsSL https://raw.githubusercontent.com/sarathsp06/testhooks/main/deploy/docker-compose.yml | docker compose -p testhooks -f - up -d
#
# Then open http://localhost:8080. Override settings with environment
# variables, e.g. TESTHOOKS_PORT=9000 AUTH_TOKEN=secret docker compose ... up -d
name: testhooks

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: testhooks
      POSTGRES_PASSWORD: testhooks
      POSTGRES_DB: testhooks
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testhooks"]
      interval: 5s
      timeout: 3s
      retries: 10

  testhooks:
    image: ghcr.io/sarathsp06/testhooks:${TESTHOOKS_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${TESTHOOKS_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://testhooks:testhooks@postgres:5432/testhooks?sslmode=disable
      LISTEN: ":8080"
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
